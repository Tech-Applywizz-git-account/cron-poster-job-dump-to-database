name: LinkedIn Job Postings Daily Report
on:
  schedule:
    - cron: "0 13 * * *"  # Runs every day at 6:30 PM IST (13:00 UTC)
  workflow_dispatch:      # Allows manual trigger
jobs:
  linkedin-jobs-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12" # Specify the Python version (e.g., 3.x)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run LinkedIn Job Postings Report
        env:
          # Source Database (Read)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Destination Database (Supabase Write)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python api_send_email_notification.py
